[versions]
cloud-minecraft = "2.0.1"
adventure = "5.2.0"

[libraries]
platform-paper = { module = "io.papermc.paper:paper-api", version = "26.2.build.+" }
platform-velocity = { module = "com.velocitypowered:velocity-api", version = "4.2.0" }

# Common
adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
dazzleconf = { module = "space.arim.dazzleconf:dazzleconf-toml", version = "2.0.0-M3" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }
slf4j = { module = "org.slf4j:slf4j-api", version = "2.0.20" }
inventoryframework = { module = "com.github.stefvanschie.inventoryframework:IF", version = "0.12.1" }

# Cloud
cloud-minecraft-extras = { module = "org.incendo:cloud-minecraft-extras", version.ref = "cloud-minecraft" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-minecraft" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-minecraft" }
cloud-requirements = { module = "org.incendo:cloud-processors-requirements", version = "1.0.0-rc.1" }

# Storage
flyway-core = { module = "org.flywaydb:flyway-core", version = "13.9.0" }
storage-sqlite = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }

plugin-carbon = { module = "de.hexaoxi:carbonchat-api", version = "3.0.0-beta.39" }
plugin-citizens = { module = "net.citizensnpcs:citizens-main", version = "2.0.42-SNAPSHOT" }
plugin-huskhomes = { module = "net.william278.huskhomes:huskhomes-bukkit", version = "4.11" }
plugin-luckperms = { module = "net.luckperms:api", version = "5.5" }
plugin-mbedwars = { module = "de.marcely.bedwars:API", version = "5.5.8" }
plugin-miniplaceholders = { module = "io.github.miniplaceholders:miniplaceholders-api", version = "3.2.0" }

[plugins]
resourcefactory-velocity = { id = "xyz.jpenilla.resource-factory-velocity-convention", version = "1.3.1" }
resourcefactory-paper = { id = "xyz.jpenilla.resource-factory-paper-convention", version = "1.3.1" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
spotless = { id = "com.diffplug.spotless", version = "8.10.3" }
versions = { id = "io.github.ben-manes.versions", version = "0.64.0" }